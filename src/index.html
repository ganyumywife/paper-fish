<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>纸想摸鱼 · 桌面便签本</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shell.css"></head>
<body>
  <header aria-label="便签操作"><span class="brand">纸想摸鱼</span><div class="window-tools"><button id="tools" title="展开或收起工具" aria-expanded="false">···</button><button id="top" title="切换置顶" aria-label="切换置顶"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg></button><button id="collapse" title="收起便签" aria-label="收起便签">−</button><button id="hide" title="隐藏到托盘" aria-label="隐藏到托盘">×</button></div></header>
  <main id="workspace">
    <nav id="toolbar"><button id="new">＋ 新页</button><button id="ai">图片录入</button><button id="bin">垃圾桶</button><button id="sling">弹弓</button><button id="shelf">便签管理</button><button id="gather">聚拢纸团</button><button id="settings" title="设置" aria-label="设置">⚙</button></nav>
    <section id="editor-area">
      <div class="page-heading"><span id="page-label">随手记一点</span><div><button id="prev" title="上一页">‹</button><span id="page-count"></span><button id="next" title="下一页">›</button></div></div>
      <article id="paper"><div class="paper-stack" aria-hidden="true"></div><div class="paper-stack" aria-hidden="true"></div><div id="sheet"><div id="paper-outline" aria-hidden="true"></div><div class="tear-line"></div><div id="text" contenteditable="false" role="textbox" aria-multiline="true" aria-label="便签内容" data-placeholder="写点什么…" spellcheck="false"></div><button class="paper-drag" title="拖动移动便签 · 方向键微调" aria-label="移动便签">⠿</button><button class="paper-drag" title="拖动移动便签 · 方向键微调" aria-label="移动便签" hidden>⠿</button></div><button id="tear-left" class="tear-handle" title="从左上角向内揭起撕页" aria-label="从左上角撕页"><span></span></button><button id="tear-corner" class="tear-handle" title="从右上角向内揭起撕页" aria-label="从右上角撕页"><span></span></button></article>
      <div class="appearance"><small id="format-scope">未选中文字：设置整页</small><input id="color" type="color" aria-label="纸张颜色"><select id="font" aria-label="字体"><option value="print">印刷体</option><option value="hand">手写体</option></select><select id="size" aria-label="字号"><option>16</option><option>20</option><option>24</option><option>28</option><option>32</option></select><select id="shape" aria-label="纸张形状"><option value="rounded">圆角</option><option value="square">直角</option><option value="circle">圆形</option><option value="heart">心形</option><option value="torn">撕边</option></select><select id="texture" aria-label="纸张纹理"><option value="plain">空白纸</option><option value="lined">横线纸</option><option value="grid">方格纸</option></select><button id="bold" title="选中文字加粗；未选择时整页加粗">B</button><input id="ink" type="color" aria-label="文字颜色" value="#454536"><select id="align" aria-label="对齐"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select><button id="todo" title="将当前行或选中行设为待办，再次点击取消待办">☐</button><button id="lock" title="锁定位置">锁定</button><button id="default-style" title="新建及自动补充空白页使用当前外观，不影响已有页面">设为默认</button><button id="reset-default-style" title="恢复新页的初始外观">重置默认</button></div>
      <footer><span id="save-state">已保存到本机</span><button id="pin">钉到桌面</button><button id="tear" class="accent">撕下揉团</button></footer>
    </section>
    <section id="shelf-area" hidden><div class="section-title"><div><h1>便签管理</h1></div><button id="trash-toggle">回收站</button></div><select id="search-scope" aria-label="查找范围"><option value="ball">桌面纸团</option><option value="all">全部内容</option><option value="book">便签本</option><option value="pinned">钉贴</option><option value="trash">回收站</option></select><input id="search" placeholder="搜索便签" aria-label="搜索便签"><div id="balls"></div><button id="trash-clear" hidden>清空回收站</button><div id="drop-bin">♜ <span>拖入回收站</span></div></section>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form">
    <h2 id="settings-title">设置</h2>
    <fieldset id="ai-settings-group"><legend>AI 图片识别</legend>
      <label>API 地址<input id="api-base" title="兼容 Chat Completions；填写基础地址，不含 /chat/completions" type="url" required></label>
      <label>视觉模型<input id="api-model" placeholder="填写服务商提供的模型 ID" required></label>
      <label>API Key<input id="api-key" type="password" autocomplete="off" placeholder="输入 API Key"></label>
      <label class="check"><input id="clear-key" type="checkbox">清除已保存的密钥</label>
      <p id="key-status" role="status"></p>
      <div class="dialog-actions"><button type="button" id="test-ai" title="保存配置并发送一张测试图片，可能产生少量 API 费用">保存并测试</button></div>
    </fieldset>
    <fieldset id="general-settings-group"><legend>桌面与交互</legend>
      <label class="check"><input id="motion" type="checkbox">启用撕纸动画</label><label class="check"><input id="paper-sound" type="checkbox">交互音效</label><label class="volume-row">音量<input id="sound-volume" type="range" min="0" max="100" step="5" aria-label="音效音量"><button id="sound-test" type="button">试听</button></label><label class="check"><input id="fullscreen-avoid" type="checkbox">全屏时自动隐藏</label>
      <details id="shortcut-options"><summary>快捷键</summary><label>显示 / 隐藏<div class="shortcut-field"><input id="shortcut-toggle" readonly aria-label="显示隐藏快捷键" placeholder="未启用" title="按下组合键；退格清除"><button type="button" data-shortcut-clear="toggle" aria-label="清除显示隐藏快捷键">×</button></div></label><label>新建便签<div class="shortcut-field"><input id="shortcut-new" readonly aria-label="新建便签快捷键" placeholder="未启用" title="按下组合键；退格清除"><button type="button" data-shortcut-clear="new" aria-label="清除新建便签快捷键">×</button></div></label><label>查找便签<div class="shortcut-field"><input id="shortcut-search" readonly aria-label="查找便签快捷键" placeholder="未启用" title="按下组合键；退格清除"><button type="button" data-shortcut-clear="search" aria-label="清除查找便签快捷键">×</button></div></label><div class="dialog-actions"><button type="button" id="shortcut-reset">恢复默认</button><button type="button" id="shortcut-save">保存快捷键</button></div><p id="shortcut-status" role="status" hidden></p></details>
    </fieldset>
    <div class="dialog-actions backup-actions"><button type="button" id="backup-export">导出备份</button><button type="button" id="backup-import">导入备份</button></div>
    <div class="dialog-actions"><button type="button" data-close>取消</button><button class="accent">保存</button></div>
  </form></dialog>
  <dialog id="ai-dialog"><div class="ai-heading"><h2>图片录入</h2><div class="ai-heading-actions"><button id="ai-settings" type="button">AI 设置</button><button data-close aria-label="关闭图片录入">×</button></div></div><p id="destination" role="status"></p><div class="ai-target"><span id="target-label"></span><button id="retarget">改用当前页</button></div><div class="ai-scroll"><label class="upload" id="upload-zone" title="选择、拖入或粘贴图片">＋ 添加图片<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="image-preview" hidden alt="待识别图片"><div id="image-editor" hidden><canvas id="crop-canvas" aria-label="拖动框选识别区域"></canvas><div class="dialog-actions"><button id="rotate-image">旋转 90°</button><button id="crop-image">裁剪选区</button><button id="reset-image">还原原图</button></div></div><label id="result-label"><span class="result-heading">识别结果<button id="split-toggle" type="button" title="预览并调整分页后再录入">拆页</button></span><textarea id="ai-result" placeholder="识别后可编辑"></textarea></label><section id="split-preview" hidden><div class="split-controls"><select id="split-size" aria-label="拆页字数"><option value="160">每页约 160 字</option><option value="320" selected>每页约 320 字</option><option value="640">每页约 640 字</option></select><button id="split-rebuild" type="button" title="按当前全部文字重新分页">重新分页</button></div><div class="split-navigation"><button id="split-prev" aria-label="上一张拆页">‹</button><span id="split-count"></span><button id="split-next" aria-label="下一张拆页">›</button></div><textarea id="split-text" aria-label="当前拆页内容"></textarea><div class="split-controls"><button id="split-at-caret" title="在光标处拆成两页">光标处分开</button><button id="split-merge" title="与下一页合并">合并下一页</button></div></section></div><div class="ai-actions"><div class="dialog-actions"><select id="ai-mode"><option value="literal">忠实转录</option><option value="summary">整理为便签</option></select><button id="recognize" title="将图片发送到所配置的 AI 服务，可能产生 API 费用" class="accent">开始识别</button><button id="cancel-ai">取消请求</button></div><select id="import-target"><option value="new">新建一页</option><option value="append">追加到指定页</option><option value="pinned">钉到桌面</option></select><div class="dialog-actions"><button id="import" class="accent">录入</button></div></div></dialog>
  <dialog id="preview-dialog"><h2>展开看看</h2><p id="preview-date"></p><pre id="preview-text"></pre><div class="dialog-actions"><button data-close>收起</button><button id="restore">放回本子</button><button id="restore-pin">钉到桌面</button><button id="dispose">放入回收站</button></div></dialog>
  <aside id="side-menu" aria-label="便签工具"><div id="side-controls"></div><details id="tool-options"><summary>更多设置</summary><label>工具位置<select id="dock-side"><option value="auto">自动选择</option><option value="left">左侧</option><option value="right">右侧</option></select></label><label class="check"><input id="orb-snap" type="checkbox" checked>贴边吸附</label></details></aside><button id="orb" aria-label="展开便签" title="点击展开 · 拖动移动 · 右键菜单">纸<span>鱼</span></button><button id="resize-left" title="拖动整体缩放 · Shift 拖动调整纸面尺寸" aria-label="从左下角缩放便签">⌞</button>
  <button id="resize-handle" title="拖动整体缩放 · Shift 拖动调整纸面尺寸" aria-label="从右下角缩放便签">⌟</button>
  <canvas id="paper-motion" hidden></canvas><div id="toast" role="status" hidden></div><script src="pagination.js"></script><script src="state-sync.js"></script><script src="sound.js"></script><script src="page-info.js"></script><script src="rich-text.js"></script><script src="note-editor.js"></script><script src="image-editor.js"></script><script src="paper-shape.js"></script><script src="paper-motion.js"></script><script src="desktop-interaction.js"></script><script src="renderer.js"></script><script src="shell.js"></script><script src="workflow.js"></script>
</body></html>
